spring.application.name=arte-de-la-montana
# Cloud Run injects $PORT; fall back to 8080 for local dev.
server.port=${PORT:8080}

# Points at the assets folder. In the Docker image this is /app/assets;
# locally it falls back to the sibling folder on disk.
assets.directory=${ASSETS_DIR:../assets(2)}

# Stripe (real payments). Use a TEST key while developing.
# Set STRIPE_API_KEY=sk_test_... in the environment before launching.
stripe.api.key=${STRIPE_API_KEY:}
stripe.currency=${STRIPE_CURRENCY:usd}

# Mail (used to notify the artist when someone inquires).
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

inquiry.notify.to=${INQUIRY_TO:}
inquiry.notify.from=${INQUIRY_FROM:}

# Shared secret for the /admin/payment-link form.
admin.secret=${ADMIN_SECRET:}

# Templates: reload during dev
spring.thymeleaf.cache=false

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header class="site-header" th:fragment="site-header(active)">
    <a th:href="@{/}" class="brand" aria-label="Arte de la Montaña — home">
        <span class="brand-bear">
            <img th:src="@{/assets/andean-bear-icon.png}" alt="">
        </span>
    </a>
    <nav class="site-nav">
        <a th:href="@{/}"          th:classappend="${active == 'home'}     ? 'active'">Gallery</a>
        <a th:href="@{/andrea}"    th:classappend="${active == 'andrea'}   ? 'active'">Andrea</a>
        <a th:href="@{/customize}" th:classappend="${active == 'customize'}? 'active'">Customize</a>
    </nav>
</header>

<footer class="site-footer" th:fragment="site-footer">
    <img th:src="@{/assets/footer.png}" alt="">
    <p class="quiet">© Arte de la Montaña</p>
</footer>
</body>
</html>

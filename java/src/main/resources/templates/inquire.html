<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="'Inquire — ' + ${artwork.title}">Inquire</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" type="image/png" th:href="@{/assets/andean-bear-icon.png}">
</head>
<body>
<div th:replace="~{fragments/header :: site-header('')}"></div>

<main class="inquire">
    <section class="summary">
        <img th:src="@{${artwork.assetPath}}" th:alt="${artwork.title}">
        <div>
            <h1 th:text="${artwork.title}">Title</h1>
            <p class="meta">
                <span th:text="${artwork.year}">2026</span> ·
                <span th:text="${artwork.medium}">acrylic</span> ·
                <span th:text="${artwork.size}">Medium</span>
            </p>
        </div>
    </section>

    <form method="post" th:action="@{'/inquire/' + ${artwork.slug}}" th:object="${form}" class="form">
        <label>
            Your name
            <input type="text" th:field="*{name}" required>
        </label>
        <label>
            Email
            <input type="email" th:field="*{email}" required>
        </label>
        <label>
            Message (optional)
            <textarea th:field="*{message}" rows="5" placeholder="Anything I should know — destination, framing, timing…"></textarea>
        </label>
        <button type="submit" class="btn">Send inquiry</button>
        <p class="quiet small">You'll receive a private payment link by email.</p>
    </form>
</main>

<div th:replace="~{fragments/header :: site-footer}"></div>
</body>
</html>

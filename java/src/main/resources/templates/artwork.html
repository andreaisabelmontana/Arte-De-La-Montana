<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${artwork.title} + ' — Arte de la Montaña'">Artwork</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" type="image/png" th:href="@{/assets/andean-bear-icon.png}">
</head>
<body>
<div th:replace="~{fragments/header :: site-header('')}"></div>

<main class="artwork-detail">
    <div class="frame">
        <img th:src="@{${artwork.assetPath}}" th:alt="${artwork.title}">
    </div>
    <aside class="info">
        <h1 th:text="${artwork.title}">Title</h1>
        <p class="meta">
            <span th:text="${artwork.year}">2026</span> ·
            <span th:text="${artwork.medium}">acrylic</span> ·
            <span th:text="${artwork.size}">Medium</span>
        </p>
        <a th:href="@{'/inquire/' + ${artwork.slug}}" class="btn">Inquire to purchase</a>
        <p class="quiet small">All works are originals. Purchase by inquiry to receive a private payment link.</p>
    </aside>
</main>

<div th:replace="~{fragments/header :: site-footer}"></div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customize — Arte de la Montaña</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" type="image/png" th:href="@{/assets/andean-bear-icon.png}">
</head>
<body>
<div th:replace="~{fragments/header :: site-header('customize')}"></div>

<main class="customize">
    <section class="banner-yellow">
        <h1 class="brushed">Customize</h1>
        <p>Life's a climb. But the view is great.</p>
    </section>

    <section class="customize-form">
        <h2>Commission a piece</h2>
        <form method="post" action="#" class="form">
            <label>
                Your name
                <input type="text" name="name" required>
            </label>
            <label>
                Email
                <input type="email" name="email" required>
            </label>
            <label>
                Tell me what you have in mind
                <textarea name="brief" rows="6" placeholder="Subject, mood, medium, dimensions, where it will live…" required></textarea>
            </label>
            <button type="submit" class="btn">Send</button>
        </form>
    </section>

    <section class="customize-examples">
        <img th:src="@{/assets/mafalda-1.png}" alt="">
        <img th:src="@{/assets/mafalda-2.png}" alt="">
        <img th:src="@{/assets/mafalda-3.png}" alt="">
        <img th:src="@{/assets/mafalda-4.png}" alt="">
    </section>
</main>

<div th:replace="~{fragments/header :: site-footer}"></div>
</body>
</html>
